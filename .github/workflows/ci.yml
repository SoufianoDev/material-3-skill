name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill and OpenCode plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Run repository checks
        run: bash bin/ci

      - name: Install plugin dependencies
        working-directory: plugins/material-3-opencode
        run: bun install

      - name: Type-check OpenCode plugin
        working-directory: plugins/material-3-opencode
        run: bun run typecheck

      - name: Install MiMo Code plugin dependencies
        working-directory: plugins/material-3-mimocode
        run: bun install

      - name: Type-check MiMo Code plugin
        working-directory: plugins/material-3-mimocode
        run: bun run typecheck
